name: Invio agenzie

on:
  schedule:
    # ogni 15 minuti, lun-ven, 08:00-16:45 UTC = 9:00-17:45 in Italia (ora solare).
    # Dall'ultima domenica di marzo (ora legale) cambia in "*/15 7-15 * * 1-5".
    - cron: "*/15 8-16 * * 1-5"
  workflow_dispatch:
    inputs:
      prova:
        description: "1 = prova senza spedire e senza salvare"
        required: false
        default: "0"

concurrency:
  group: invio-agenzie
  cancel-in-progress: false

jobs:
  invio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python invio.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          PROVA: ${{ github.event.inputs.prova || '0' }}
